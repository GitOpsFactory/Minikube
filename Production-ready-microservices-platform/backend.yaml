apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: project-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: hashicorp/http-echo:1.0.0
        args:
        - "-listen=:5678"
        - "-text=Backend service is healthy"

        ports:
        - containerPort: 5678

        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi

        readinessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 2
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: project-microservices
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 5678
    targetPort: 5678