apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: project-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.27-alpine

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi

        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10

        volumeMounts:
        - name: frontend-config
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true

        - name: frontend-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true

      volumes:
      - name: frontend-config
        configMap:
          name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: project-microservices
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80