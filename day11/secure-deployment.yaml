apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-deployment
  namespace: k8s-day11
spec:
  replicas: 2
  selector:
	matchLabels:
	  app: secure-app
  template:
	metadata:
	  labels:
		app: secure-app
	spec:
	  securityContext:
	    runAsnonRoot: true
		runasUser: 10001
		runasGroup: 10001
		seccompprofile:
		  type: RuntimeDefault

	  containers:
	  - name: secure-container
	    image: busybox:1.36.1
		command: ["sh", "-c", "sleep 3600"]
