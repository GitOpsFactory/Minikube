
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-frontend
  template:
    metadata:
      labels:
        app: orders-frontend
    spec:
      containers:
        - name: frontend
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: frontend-code
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: frontend-code
          configMap:
            name: orders-frontend-code
        - name: nginx-config
          configMap:
            name: orders-frontend-code
---
apiVersion: v1
kind: Service
metadata:
  name: orders-frontend
spec:
  selector:
    app: orders-frontend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
