apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-pt
  labels:
    app: orders-pt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-pt
  template:
    metadata:
      labels:
        app: orders-pt
    spec:
      imagePullSecrets:
        - name: kuslapur-pull-secret
      containers:
        - name: nginx
          image: quay.io/kuslapur/orders-passthrough:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tls-certificate
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: tls-certificate
          secret:
            secretName: orders-pt-tls
            defaultMode: 292